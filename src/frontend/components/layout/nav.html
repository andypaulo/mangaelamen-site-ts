<!-- nav.html — redesenho editorial escuro -->
<!-- IDs preservados: navAdminLink (hidden), navAuthArea -->
<!-- Classes preservadas: nav-link, data-page="..." (usados por nav-auth.js e nav-active.js) -->

<style>
  #site-nav {
    position: sticky;
    top: 0;
    z-index: 200;
    background: #111215;
    border-bottom: 1px solid #23252b;
  }

  #site-nav .nav-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 2rem;
    height: 60px;
    display: flex;
    align-items: center;
    gap: 0;
  }

  /* Logo */
  #site-nav .nav-logo {
    display: flex;
    align-items: center;
    gap: 0.625rem;
    text-decoration: none;
    flex-shrink: 0;
    margin-right: auto;
  }

  #site-nav .nav-logo img {
    height: 36px;
    width: auto;
    object-fit: contain;
    display: block;
  }

  #site-nav .nav-logo .logo-text {
    font-family: 'Poppins', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    color: #fbf9f5;
    letter-spacing: -0.01em;
    line-height: 1;
  }

  #site-nav .nav-logo .logo-text span {
    color: var(--color-brandpink, #e8537a);
  }

  /* Nav links group */
  #site-nav .nav-links {
    display: flex;
    align-items: center;
    gap: 0.25rem;
  }

  /* Individual nav link */
  #site-nav .nav-link {
    position: relative;
    display: flex;
    align-items: center;
    gap: 0.375rem;
    padding: 0.5rem 0.875rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.875rem;
    font-weight: 500;
    color: #fbf9f5;
    text-decoration: none;
    border-radius: 8px;
    transition: color 0.18s ease, background 0.18s ease;
    white-space: nowrap;
  }

  /* Força ocultação total do link de admin quando deslogado / não-admin */
  #site-nav #navAdminLink.hidden,
  #site-nav .nav-link.hidden {
    display: none !important;
  }

  #site-nav .nav-link::after {
    content: '';
    position: absolute;
    bottom: 2px;
    left: 0.875rem;
    right: 0.875rem;
    height: 1.5px;
    background: var(--color-brandpink, #e8537a);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.22s ease;
    border-radius: 1px;
  }

  #site-nav .nav-link:hover {
    color: #ffffff;
    background: rgba(255, 255, 255, 0.08);
  }

  #site-nav .nav-link:hover::after {
    transform: scaleX(1);
  }

  /* Active state — controlado por nav-active.js */
  #site-nav .nav-link.text-brandyellow {
    color: var(--color-brandyellow, #f4a300) !important;
    font-weight: 600;
    background: rgba(244, 163, 0, 0.12);
  }

  #site-nav .nav-link.text-brandyellow::after {
    background: var(--color-brandyellow, #f4a300);
    transform: scaleX(1);
  }

  /* Auth area */
  #site-nav #navAuthArea {
    margin-left: 1.25rem;
    flex-shrink: 0;
    position: relative;
    display: flex;
    align-items: center;
  }

  /* ── Mobile ───────────────────────────────────────────── */
  @media (max-width: 640px) {
    #site-nav .nav-inner {
      padding: 0 1rem;
      height: 56px;
    }

    #site-nav .nav-links {
      gap: 0;
    }

    #site-nav .nav-link {
      padding: 0.5rem 0.625rem;
      font-size: 0.8125rem;
    }

    #site-nav .nav-link .nav-label {
      display: none;
    }

    #site-nav .nav-logo .logo-text {
      display: none;
    }

    #site-nav #navAuthArea {
      margin-left: 0.5rem;
    }
  }
</style>

<nav id="site-nav" role="navigation" aria-label="Navegação principal">
  <div class="nav-inner">

    <!-- Logo -->
    <a href="/pages/homepage/index.html" class="nav-logo" aria-label="Mangá & Lamen — página inicial">
      <img src="/assets/public/images/manga&lamenlogo.png" alt="Mangá & Lamen" />
      <span class="logo-text">Mangá<span>&</span>Lamen</span>
    </a>

    <!-- Links principais -->
    <div class="nav-links" role="list">

      <a href="/pages/homepage/index.html"
         data-page="homepage"
         class="nav-link"
         role="listitem"
         aria-label="Início">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
             fill="currentColor" aria-hidden="true" class="nav-icon shrink-0">
          <path d="M12 2.1 1 12h3v9h7v-6h2v6h7v-9h3L12 2.1zm0 2.69 6 5.4V19h-3v-6H9v6H6v-8.81l6-5.4z"/>
        </svg>
        <span class="nav-label">Início</span>
      </a>

      <a href="/pages/vitrine/index.html"
         data-page="vitrine"
         class="nav-link"
         role="listitem"
         aria-label="Mangás">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
             fill="currentColor" aria-hidden="true" class="nav-icon shrink-0">
          <path d="M18 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zM6 4h5v8l-2.5-1.5L6 12V4zm12 16H6V14l3.5-2.1 2.5 1.5 2.5-1.5L18 14v6z"/>
        </svg>
        <span class="nav-label">Mangá</span>
      </a>

      <a href="/pages/cart/cart.html"
         data-page="cart"
         class="nav-link"
         role="listitem"
         aria-label="Carrinho">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="currentColor"
             viewBox="0 0 16 16" aria-hidden="true" class="nav-icon shrink-0">
          <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M3.102 4l1.313 7h8.17l1.313-7zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4m-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2m7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/>
        </svg>
        <span class="nav-label">Carrinho</span>
      </a>

      <!-- Admin — hidden por padrão; nav-auth.js remove hidden se role === ADMIN -->
      <a href="/pages/admin/admin.html"
         id="navAdminLink"
         data-page="admin"
         class="nav-link hidden"
         style="display: none;"
         role="listitem"
         aria-label="Painel admin">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
             fill="currentColor" aria-hidden="true" class="nav-icon shrink-0">
          <path d="M12 1 3 5v6c0 5.25 3.75 10.15 9 11.25C17.25 21.15 21 16.25 21 11V5l-9-4zm-1 14-3-3 1.4-1.4 1.6 1.6 4.6-4.6L17 9l-6 6z"/>
        </svg>
        <span class="nav-label">Admin</span>
      </a>

    </div><!-- /nav-links -->

    <!-- Preenchido em runtime por nav-auth.js: botão "Entrar" ou menu do usuário logado -->
    <div id="navAuthArea" class="relative flex items-center"></div>

  </div>
</nav>
