<!-- header.html — redesenho editorial escuro -->
<!-- IDs preservados: searchForm, searchInput, searchPreview, suggestionsList (usados por header-search.js) -->

<style>
  #site-header {
    background: #111215;
    border-bottom: 1px solid #23252b;
    padding: 0.75rem 0;
  }

  #site-header .header-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 2rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  /* Search wrapper */
  #site-header .search-wrap {
    position: relative;
    flex: 1;
    max-width: 540px;
    margin: 0 auto;
  }

  /* Search icon inside field */
  #site-header .search-icon {
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    color: #8b8f9a;
    pointer-events: none;
    display: flex;
    align-items: center;
  }

  /* Input */
  #site-header #searchInput {
    width: 100%;
    padding: 0.625rem 1rem 0.625rem 2.75rem;
    background: #1a1c23;
    border: 1px solid #2d313c;
    border-radius: 999px;
    font-family: 'Inter', sans-serif;
    font-size: 0.875rem;
    color: #fbf9f5;
    outline: none;
    transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
  }

  #site-header #searchInput::placeholder {
    color: #727785;
  }

  #site-header #searchInput:focus {
    background: #20232c;
    border-color: var(--color-brandpink, #e8537a);
    box-shadow: 0 0 0 3px rgba(232, 83, 122, 0.2);
  }

  /* Autocomplete dropdown */
  #site-header #searchPreview {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: #1a1c23;
    border: 1px solid #2d313c;
    border-radius: 14px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
    z-index: 999;
    overflow: hidden;
  }

  #site-header #searchPreview.hidden {
    display: none;
  }

  #site-header #suggestionsList {
    list-style: none;
    margin: 0;
    padding: 0.375rem;
  }

  #site-header #suggestionsList li {
    border-bottom: 1px solid #232630;
  }

  #site-header #suggestionsList li:last-child {
    border-bottom: none;
  }

  #site-header #suggestionsList li a {
    display: block;
    padding: 0.625rem 1rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.875rem;
    color: #fbf9f5;
    text-decoration: none;
    border-radius: 8px;
    transition: background 0.15s ease, color 0.15s ease, padding-left 0.15s ease;
  }

  #site-header #suggestionsList li a:hover {
    background: #262934;
    color: #ffffff;
    padding-left: 1.25rem;
  }

  /* ── Mobile ───────────────────────────────────────────── */
  @media (max-width: 640px) {
    #site-header .header-inner {
      padding: 0 1rem;
    }

    #site-header .search-wrap {
      max-width: 100%;
    }
  }
</style>

<header id="site-header" role="banner">
  <div class="header-inner">

    <div class="search-wrap">
      <!-- Search icon -->
      <span class="search-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </span>

      <form method="get" action="/" id="searchForm" role="search">
        <input
          type="search"
          id="searchInput"
          name="search"
          placeholder="Buscar mangá por título, autor ou gênero…"
          autocomplete="off"
          aria-label="Buscar mangá"
          spellcheck="false"
        />
      </form>

      <!-- Autocomplete — preenchido por header-search.js -->
      <div id="searchPreview" class="hidden" role="listbox" aria-label="Sugestões de busca">
        <ul id="suggestionsList" role="list"></ul>
      </div>
    </div>

  </div>
</header>
