<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manga&Lamen - Vitrine</title>

  <link rel="stylesheet" href="/css/style.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="icon" type="image/x-icon" href="/images/manga&lamenlogo.webp" />
</head>
<body class="font-poppins bg-[#d3d3d3] pb-[60px]">

  <div data-include="/components/layout/header.html"></div>
  <div data-include="/components/layout/nav.html"></div>

  <!-- ===================== AVISO DE ESTOQUE ===================== -->
  <!-- Antes vinha do controller (`avisoEstoque`). Agora é preenchido via JS,
       se a API mandar esse aviso junto com a resposta de /api/produtos. -->
  <div id="stockWarningWrapper" class="hidden max-w-4xl mx-auto mt-4 px-4">
    <div class="bg-amber-100 border border-amber-300 text-amber-800 text-center rounded-lg py-3 px-4 flex items-center justify-center gap-2">
      <span>⚠️</span>
      <span id="stockWarningText"></span>
    </div>
  </div>

  <!-- ===================== VITRINE ===================== -->
  <main role="main">
    <section class="p-5">
      <div class="max-w-7xl mx-auto mt-4">

        <h2 class="mb-6 text-center text-3xl font-bold text-[#111]">Produtos em Destaque</h2>

        <!-- ===== BARRA DE FILTROS ===== -->
        <form id="filterForm" class="mb-8 bg-white rounded-2xl shadow-sm p-4 md:p-5">
          <div class="grid grid-cols-1 md:grid-cols-[1fr_1fr_1fr_1fr_auto] gap-3 items-end">

            <div class="flex flex-col gap-1">
              <label for="category" class="text-xs font-semibold text-[#555]">Categoria</label>
              <select id="category" name="category" class="border border-[#ddd] rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brandpink/40">
                <option value="">Todas Categorias</option>
                <!-- opções preenchidas via JS a partir de /api/categorias -->
              </select>
            </div>

            <div class="flex flex-col gap-1">
              <label for="minPrice" class="text-xs font-semibold text-[#555]">Preço mínimo</label>
              <input type="number" id="minPrice" name="minPrice" min="0" step="0.01" placeholder="R$ 0,00"
                     class="border border-[#ddd] rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brandpink/40" />
            </div>

            <div class="flex flex-col gap-1">
              <label for="maxPrice" class="text-xs font-semibold text-[#555]">Preço máximo</label>
              <input type="number" id="maxPrice" name="maxPrice" min="0" step="0.01" placeholder="R$ 999,90"
                     class="border border-[#ddd] rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brandpink/40" />
            </div>

            <div class="flex flex-col gap-1">
              <label for="sortBy" class="text-xs font-semibold text-[#555]">Ordenar por</label>
              <select id="sortBy" name="sortBy" class="border border-[#ddd] rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brandpink/40">
                <option value="relevancia">Relevância</option>
                <option value="preco_asc">Menor preço</option>
                <option value="preco_desc">Maior preço</option>
                <option value="nome_asc">Nome (A-Z)</option>
              </select>
            </div>

            <div>
              <button type="button" id="btnClearFilters" class="w-full md:w-auto text-sm text-[#666] hover:text-[#111] underline underline-offset-2 px-2 py-2">
                Limpar
              </button>
            </div>
          </div>
        </form>

        <!-- ===== STATUS (carregando / contagem) ===== -->
        <div id="filterStatus" class="text-sm text-[#666] mb-3 min-h-[20px]"></div>

        <!-- ===== GRID DE PRODUTOS ===== -->
        <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5"></div>

        <!-- ===== ESTADO VAZIO ===== -->
        <div id="emptyState" class="hidden text-center py-16 text-[#777]">
          <p class="text-lg font-semibold mb-1">Nenhum produto encontrado</p>
          <p class="text-sm">Tente ajustar os filtros de categoria, preço ou ordenação.</p>
        </div>

        <!-- ===== PAGINAÇÃO ===== -->
        <div id="paginationWrapper" class="flex justify-center items-center gap-[100px] mt-9"></div>

        <div class="flex justify-center items-center gap-3 mt-3">
          <span id="pageLabel" class="text-[#333] text-[15px]">Página 1 de 1</span>
        </div>

      </div>
    </section>
  </main>

  <!-- ===================== MODAL QUICK VIEW ===================== -->
  <div id="modalQuickView" class="hidden fixed inset-0 z-[1000] bg-black/60 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-3xl w-full max-h-[85vh] overflow-y-auto relative">
      <button id="closeModal" class="absolute top-4 right-4 text-[#333] hover:text-black text-2xl leading-none z-10">&times;</button>
      <div id="modalContent" class="grid grid-cols-1 md:grid-cols-2 gap-6 p-6">
        <!-- Preenchido via JS -->
      </div>
    </div>
  </div>
  
</body>
  <script src="/scripts/include-layout.js"></script>
  <script src="/scripts/nav-active.js"></script>
  <script src="/scripts/header-search.js"></script>
  <script type="module" src="/scripts/main.js"></script>
  <script src="/scripts/nav-auth.js"></script>
  <script src="/scripts/auth.js"></script>
</html>
